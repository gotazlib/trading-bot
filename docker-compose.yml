services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: trading-db
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: tradingbot
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

volumes:
  timescale_data:
