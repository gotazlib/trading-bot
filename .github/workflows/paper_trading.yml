name: Paper-Trading Bot

# Läuft Werktags um 22:00 UTC (=23:00 Schweizer Zeit Winter / 00:00 Sommer)
# 22:00 UTC = exakt nach Forex Daily-Close (NY-Close)
on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # erlaubt manuellen Trigger via GitHub-UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # erlaubt Commit der Resultate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy openpyxl matplotlib

      - name: Run Paper-Trading Bot
        run: |
          python -m scripts.paper_trading 2>&1 | tee results/paper_log.txt
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit Results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Paper-Trading Bot"
          git add results/
          if ! git diff --staged --quiet; then
            git commit -m "Bot-Run $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Keine Änderungen zu committen"
          fi

      - name: Upload Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trading-reports-${{ github.run_number }}
          path: |
            results/paper_report.xlsx
            results/paper_report.html
            results/paper_trades.csv
            results/paper_equity.csv
          retention-days: 90
